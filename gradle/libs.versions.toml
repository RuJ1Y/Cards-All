ktorClientAndroid = "3.4.2"
ktorClientAndroidVersion = "2.3.11"
lifecycleRuntimeKtx = "2.10.0"
logbackClassic = "1.5.38"
material = "1.13.0"
activity = "1.13.0"
constraintlayout = "2.2.1"

lifecycle-version = "2.10.0"
postgrestKt = "2.5.0"
realtimeKt = "2.5.0"
slf4jApi = "2.0.18"
supabaseVersion = "2.5.0"


[libraries]
android-sdk = { module = "com.github.minapp:android-sdk", version.ref = "androidSdk" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
